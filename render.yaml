services:
  - type: web
    name: cisconnects
    env: static
    buildCommand: npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
        force: true
      - type: rewrite
        source: /websites
        destination: /index.html
      - type: rewrite
        source: /about
        destination: /index.html
      - type: rewrite
        source: /infraaiops
        destination: /index.html
      - type: rewrite
        source: /services
        destination: /index.html
      - type: rewrite
        source: /contact
        destination: /index.html
      - type: rewrite
        source: /missedcalltextback
        destination: /index.html
      - type: rewrite
        source: /blog
        destination: /index.html
      - type: rewrite
        source: /blog/*
        destination: /index.html

