services:
  - type: web
    name: cisconnects
    env: static
    buildCommand: npm run build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      # Rewrite all non-file requests to index.html for client-side routing
      # Static assets (JS, CSS, images) are served directly by Render
      - type: rewrite
        source: /*
        destination: /index.html
        force: false

